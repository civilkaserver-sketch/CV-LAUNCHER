<svg width="1636" height="464" viewBox="0 0 1636 464" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Warm Dark Walnut Brown -->
    <linearGradient id="bgGradFix" x1="0" y1="0" x2="1636" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#221711"/>
      <stop offset="45%" stop-color="#16100c"/>
      <stop offset="100%" stop-color="#0c0806"/>
    </linearGradient>

    <!-- Ambient Emerald/Mint Green Glows -->
    <radialGradient id="mintGlow" cx="78%" cy="50%" r="48%" fx="78%" fy="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#16100c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentGlowFix" cx="22%" cy="30%" r="40%" fx="22%" fy="30%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#221711" stop-opacity="0"/>
    </radialGradient>

    <!-- Speedometer Needle Gradient -->
    <linearGradient id="needleGradFix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <pattern id="gridPatternFix" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#36251b" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1636" height="464" fill="url(#bgGradFix)"/>
  <rect width="1636" height="464" fill="url(#gridPatternFix)"/>
  <rect width="1636" height="464" fill="url(#accentGlowFix)"/>
  <rect width="1636" height="464" fill="url(#mintGlow)"/>

  <!-- Subtle Top & Bottom Border Highlights -->
  <line x1="0" y1="1" x2="1636" y2="1" stroke="#34d399" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="0" y1="463" x2="1636" y2="463" stroke="#10b981" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Decorative Speed / HUD lines in background -->
  <g opacity="0.3">
    <line x1="120" y1="56" x2="480" y2="56" stroke="#34d399" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="120" y1="412" x2="600" y2="412" stroke="#34d399" stroke-width="1" stroke-dasharray="12 6"/>
  </g>

  <!-- LEFT CONTENT BLOCK -->
  <g transform="translate(120, 75)">
    <!-- Category Pill Badge -->
    <g>
      <rect x="0" y="0" width="310" height="38" rx="6" fill="#14261c" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.7"/>
      <!-- Wrench / Tool Icon -->
      <path d="M18 26 L26 18 M24 16 A3 3 0 0 0 28 12 A3 3 0 0 0 24 8 A3 3 0 0 0 20 12 L18 14 Z" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="42" y="25" font-family="'Minecraft Rus', monospace, sans-serif" font-size="14" fill="#34d399" font-weight="bold" letter-spacing="1.5">ХОТФИКС &amp; БАЛАНС</text>
    </g>

    <!-- Main Title Line 1 -->
    <text x="0" y="112" font-family="'Minecraft Rus', monospace, sans-serif" font-size="46" fill="#ffffff" letter-spacing="2" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.85))">ФИКС, ОПТИМИЗАЦИЯ</text>
    
    <!-- Main Title Line 2 -->
    <text x="0" y="172" font-family="'Minecraft Rus', monospace, sans-serif" font-size="40" fill="#a7f3d0" letter-spacing="2" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.85))">&amp; ФИЗИКА ЛОДОК</text>

    <!-- Subtitle / Feature Pills -->
    <g transform="translate(0, 222)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="180" height="36" rx="4" fill="#122017" stroke="#10b981" stroke-width="1" stroke-opacity="0.45"/>
        <text x="18" y="23" font-family="'Minecraft Rus', monospace, sans-serif" font-size="13" fill="#34d399" letter-spacing="1">⚡ ФИКС ЛОДОК</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(196, 0)">
        <rect x="0" y="0" width="190" height="36" rx="4" fill="#122017" stroke="#10b981" stroke-width="1" stroke-opacity="0.45"/>
        <text x="18" y="23" font-family="'Minecraft Rus', monospace, sans-serif" font-size="13" fill="#34d399" letter-spacing="1">⛵ 0 КРАШЕЙ</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(402, 0)">
        <rect x="0" y="0" width="220" height="36" rx="4" fill="#122017" stroke="#10b981" stroke-width="1" stroke-opacity="0.45"/>
        <text x="18" y="23" font-family="'Minecraft Rus', monospace, sans-serif" font-size="13" fill="#34d399" letter-spacing="1">🛡️ JVM GENERATIONAL</text>
      </g>
    </g>
  </g>

  <!-- RIGHT CONTENT BLOCK: FPS SPEEDOMETER GAUGE -->
  <g transform="translate(1260, 232)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="162" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 8"/>
    <circle cx="0" cy="0" r="144" fill="none" stroke="#38251a" stroke-width="14" stroke-opacity="0.65"/>

    <!-- Speedometer Active Arc (Green zone) -->
    <!-- Arc from 140 deg to 40 deg clockwise -->
    <path d="M -102 102 A 144 144 0 1 1 102 102" fill="none" stroke="url(#needleGradFix)" stroke-width="14" stroke-linecap="round" filter="drop-shadow(0 0 16px rgba(16, 185, 129, 0.7))"/>

    <!-- Tick marks -->
    <g stroke="#a7f3d0" stroke-width="2" opacity="0.65">
      <line x1="-112" y1="-66" x2="-96" y2="-56"/>
      <line x1="-66" y1="-112" x2="-56" y2="-96"/>
      <line x1="0" y1="-130" x2="0" y2="-114" stroke-width="3.5" stroke="#34d399"/>
      <line x1="66" y1="-112" x2="56" y2="-96"/>
      <line x1="112" y1="-66" x2="96" y2="-56"/>
    </g>

    <!-- Center Display -->
    <circle cx="0" cy="0" r="98" fill="#140f0a" stroke="#38251a" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="92" fill="#19120c" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Speedometer Needle Pointing High -->
    <path d="M 0 0 L 22 -44 L 0 -58 L -4 -44 Z" fill="#34d399" filter="drop-shadow(0 0 8px rgba(52,211,153,0.9))"/>

    <!-- Big 120 Number -->
    <text x="0" y="8" font-family="'Minecraft Rus', monospace, sans-serif" font-size="48" fill="#ffffff" font-weight="bold" text-anchor="middle" letter-spacing="1" filter="drop-shadow(0 2px 10px rgba(0,0,0,0.9))">120</text>
    
    <!-- FPS Label in Vivid Emerald -->
    <text x="0" y="40" font-family="'Minecraft Rus', monospace, sans-serif" font-size="20" fill="#34d399" font-weight="bold" text-anchor="middle" letter-spacing="3">FPS</text>
    <text x="0" y="64" font-family="'Minecraft Rus', monospace, sans-serif" font-size="11" fill="#a7f3d0" opacity="0.8" text-anchor="middle" letter-spacing="1.5">STABLE SYNC</text>
  </g>
</svg>