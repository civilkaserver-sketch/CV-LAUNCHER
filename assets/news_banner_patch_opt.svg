<svg width="1636" height="464" viewBox="0 0 1636 464" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Warm Dark Brown / Earthy -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1636" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24170e"/>
      <stop offset="45%" stop-color="#18100a"/>
      <stop offset="100%" stop-color="#0e0906"/>
    </linearGradient>

    <!-- Ambient Green Glows -->
    <radialGradient id="greenGlow" cx="78%" cy="50%" r="48%" fx="78%" fy="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#16a34a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#18100a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="22%" cy="30%" r="40%" fx="22%" fy="30%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#24170e" stop-opacity="0"/>
    </radialGradient>

    <!-- Speedometer Needle Gradient -->
    <linearGradient id="needleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#3d2617" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1636" height="464" fill="url(#bgGrad)"/>
  <rect width="1636" height="464" fill="url(#gridPattern)"/>
  <rect width="1636" height="464" fill="url(#accentGlow)"/>
  <rect width="1636" height="464" fill="url(#greenGlow)"/>

  <!-- Subtle Top & Bottom Border Highlights -->
  <line x1="0" y1="1" x2="1636" y2="1" stroke="#4ade80" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="0" y1="463" x2="1636" y2="463" stroke="#22c55e" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Decorative Speed / HUD lines in background -->
  <g opacity="0.3">
    <line x1="120" y1="56" x2="480" y2="56" stroke="#4ade80" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="120" y1="412" x2="600" y2="412" stroke="#4ade80" stroke-width="1" stroke-dasharray="12 6"/>
  </g>

  <!-- LEFT CONTENT BLOCK -->
  <g transform="translate(120, 75)">
    <!-- Category Pill Badge -->
    <g>
      <rect x="0" y="0" width="310" height="38" rx="6" fill="#172619" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.7"/>
      <!-- Lightning Icon -->
      <path d="M20 20 L28 10 L24 20 L32 20 L22 31 L25 22 Z" fill="#4ade80"/>
      <text x="42" y="25" font-family="'Minecraft Rus', monospace, sans-serif" font-size="14" fill="#4ade80" font-weight="bold" letter-spacing="1.5">ОПТИМИЗАЦИЯ &amp; FPS</text>
    </g>

    <!-- Main Title Line 1 -->
    <text x="0" y="112" font-family="'Minecraft Rus', monospace, sans-serif" font-size="46" fill="#ffffff" letter-spacing="2" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.85))">ОПТИМИЗАЦИЯ ДРОПА</text>
    
    <!-- Main Title Line 2 -->
    <text x="0" y="172" font-family="'Minecraft Rus', monospace, sans-serif" font-size="40" fill="#86efac" letter-spacing="2" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.85))">&amp; СПАВН МОБОВ</text>

    <!-- Subtitle / Feature Pills -->
    <g transform="translate(0, 222)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="170" height="36" rx="4" fill="#141f14" stroke="#22c55e" stroke-width="1" stroke-opacity="0.45"/>
        <text x="18" y="23" font-family="'Minecraft Rus', monospace, sans-serif" font-size="13" fill="#4ade80" letter-spacing="1">⚡ +40% FPS</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(186, 0)">
        <rect x="0" y="0" width="190" height="36" rx="4" fill="#141f14" stroke="#22c55e" stroke-width="1" stroke-opacity="0.45"/>
        <text x="18" y="23" font-family="'Minecraft Rus', monospace, sans-serif" font-size="13" fill="#4ade80" letter-spacing="1">⚙️ 0 ФРИЗОВ</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(392, 0)">
        <rect x="0" y="0" width="220" height="36" rx="4" fill="#141f14" stroke="#22c55e" stroke-width="1" stroke-opacity="0.45"/>
        <text x="18" y="23" font-family="'Minecraft Rus', monospace, sans-serif" font-size="13" fill="#4ade80" letter-spacing="1">🎯 BOSSBAR ТАЙМЕР</text>
      </g>
    </g>
  </g>

  <!-- RIGHT CONTENT BLOCK: FPS SPEEDOMETER GAUGE -->
  <g transform="translate(1260, 232)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="162" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 8"/>
    <circle cx="0" cy="0" r="144" fill="none" stroke="#382417" stroke-width="14" stroke-opacity="0.65"/>

    <!-- Speedometer Active Arc (Green zone) -->
    <!-- Arc from 140 deg to 40 deg clockwise -->
    <path d="M -102 102 A 144 144 0 1 1 102 102" fill="none" stroke="url(#needleGrad)" stroke-width="14" stroke-linecap="round" filter="drop-shadow(0 0 16px rgba(34, 197, 94, 0.7))"/>

    <!-- Tick marks -->
    <g stroke="#86efac" stroke-width="2" opacity="0.65">
      <line x1="-112" y1="-66" x2="-96" y2="-56"/>
      <line x1="-66" y1="-112" x2="-56" y2="-96"/>
      <line x1="0" y1="-130" x2="0" y2="-114" stroke-width="3.5" stroke="#4ade80"/>
      <line x1="66" y1="-112" x2="56" y2="-96"/>
      <line x1="112" y1="-66" x2="96" y2="-56"/>
    </g>

    <!-- Center Display -->
    <circle cx="0" cy="0" r="98" fill="#150f09" stroke="#382417" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="92" fill="#1b120c" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Lightning Icon -->
    <path d="M -6 -50 L 7 -64 L 1 -50 L 9 -50 L -4 -30 L -1 -45 Z" fill="#4ade80" filter="drop-shadow(0 0 8px rgba(74,222,128,0.9))"/>

    <!-- Big 144 Number -->
    <text x="0" y="8" font-family="'Minecraft Rus', monospace, sans-serif" font-size="48" fill="#ffffff" font-weight="bold" text-anchor="middle" letter-spacing="1" filter="drop-shadow(0 2px 10px rgba(0,0,0,0.9))">144</text>
    
    <!-- FPS Label in Vivid Green -->
    <text x="0" y="40" font-family="'Minecraft Rus', monospace, sans-serif" font-size="20" fill="#4ade80" font-weight="bold" text-anchor="middle" letter-spacing="3">FPS</text>
    <text x="0" y="64" font-family="'Minecraft Rus', monospace, sans-serif" font-size="11" fill="#86efac" opacity="0.8" text-anchor="middle" letter-spacing="1.5">MAX SPEED</text>
  </g>
</svg>